name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      - name: Install CI tools
        run: python -m pip install pytest ruff
      - name: Lint production Python
        run: ruff check app.py config.py generation.py llm_client.py serve.py --select E9,F63,F7,F82
      - name: Compile Python modules
        run: python -m compileall -q -x '(^|/)(scratch|notebooks)/' .
      - name: Run contract tests
        run: pytest tests/ -v
