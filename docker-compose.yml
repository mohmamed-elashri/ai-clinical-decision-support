services:
  api:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "0"
      REDIS_URL: redis://redis:6379/0
      FLASK_API_KEY: ${API_AUTH_TOKEN}
    ports:
      - "7860:7860"
    volumes:
      - ./vectorstore:/app/vectorstore:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/live')"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
